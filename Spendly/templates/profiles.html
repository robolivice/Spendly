{% extends "base.html" %}
{% block content %}
<h1>Profiles</h1>

<div class="profile-grid">
    {% for p in profiles %}
    <div class="profile-card">
        <div class="profile-card__content">
            <a class="profile-link" href="{{ url_for('select', pid=p['id']) }}">
                <div class="avatar">{{ p['name'][0]|upper }}</div>
                <div class="profile-name">{{ p['name'] }}</div>
            </a>
            <button class="user-profile user-profile--delete" type="button"
                    data-url="{{ url_for('deleteProfile', pid=p['id']) }}"
                    data-name="{{ p['name'] }}">Delete</button>
        </div>
    </div>
    {% endfor %}

    <form class="profile-card profile-card--new" action="{{ url_for('create') }}" method="post">
        <div class="profile-card__content">
            <div class="profile-card__main">
                <div class="avatar plus">+</div>
                <input type="text" name="name" placeholder="New profile" required>
            </div>
            <button class="user-profile user-profile--create" type="submit">Create</button>
        </div>
    </form>
</div>

<dialog id="delete-dialog">
    <h2>Delete profile?</h2>
    <p id="delete-message" class="small"></p>
    <div class="dialog-actions">
        <button type="button" id="delete-cancel">Cancel</button>
        <button class="danger" type="button" id="delete-confirm">Delete</button>
    </div>
</dialog>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/profiles.js') }}" defer></script>
{% endblock %}
