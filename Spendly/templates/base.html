<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spendly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <dialog id="calendar" class="calendar" aria-labelledby="cal-title">
        <div class="cal-head">
            <button type="button" id="cal-prev" aria-label="Previous month">‹</button>
            <strong id="cal-title"></strong>
            <button type="button" id="cal-next" aria-label="Next month">›</button>
        </div>
        <div class="cal-weekdays">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
            <span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="dialog-actions">
            <button type="button" id="cal-today">Today</button>
            <button type="button" id="cal-cancel">Cancel</button>
        </div>
    </dialog>
    {% block scripts %}{% endblock %}
</body>
</html>
